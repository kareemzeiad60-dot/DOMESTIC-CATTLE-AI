name: Run Telegram Bot

on:
  workflow_dispatch:        # تشغيل يدوي من تاب Actions
  push:
    branches: ["main"]
    paths: ["bot/**", ".github/workflows/bot.yml"]
  schedule:
    - cron: "0 */5 * * *"   # إعادة تشغيل كل 5 ساعات عشان البوت يفضل شغال

# نسخة واحدة بس تشتغل، والجديدة بتحل محل القديمة (تيليجرام مبيسمحش بنسختين polling)
concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # الحد الأقصى للـ job في GitHub هو 6 ساعات
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies
        run: pip install -r bot/requirements.txt

      - name: Start bot
        working-directory: bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
